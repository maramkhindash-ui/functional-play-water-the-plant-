  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>لعبة سقاية الزهرة</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at 50% 0%, #eafff0 0%, #e3f9e9 45%, #f0fff6 100%);
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    font-size: 24px;
    color: #2e7d32;
    margin: 4px 0 2px;
    text-align: center;
  }
  .sub {
    font-size: 17px;
    color: #4c9a58;
    text-align: center;
    margin: 0 0 14px;
    line-height: 1.6;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
    border-radius: 28px;
    background: #ffffffcc;
    box-shadow: 0 12px 30px rgba(46, 125, 50, 0.18), inset 0 0 0 2px #ffffff;
    overflow: hidden;
    touch-action: none;
    margin-top: 4px;
  }
  .stage.hover-ok { box-shadow: 0 12px 30px rgba(46, 125, 50, 0.18), inset 0 0 0 4px #7de08a; }
  .stage.hover-bad { box-shadow: 0 12px 30px rgba(46, 125, 50, 0.18), inset 0 0 0 4px #ff8a8a; }
  .clean-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clean-layer img {
    width: 78%;
    height: 78%;
    object-fit: contain;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.12));
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .progress-wrap {
    width: 100%;
    max-width: 480px;
    margin-top: 14px;
  }
  .progress-track {
    width: 100%;
    height: 14px;
    background: #d9f5df;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.12);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #66bb6a, #43a047, #a5d6a7);
    border-radius: 20px;
    transition: width 0.2s ease;
  }

  .round-indicator {
    margin-top: 10px;
    font-size: 14px;
    font-weight: 700;
    color: #2e7d32;
    background: #e8f8ec;
    padding: 5px 16px;
    border-radius: 999px;
    box-shadow: 0 3px 8px rgba(67,160,71,0.2);
  }

  .bubble {
    margin-top: 16px;
    width: 100%;
    max-width: 480px;
    min-height: 60px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(46,125,50,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 18px;
    text-align: center;
  }
  .bubble .icon { font-size: 24px; }
  .bubble .msg {
    font-size: 19px;
    font-weight: 700;
    color: #2e7d32;
  }

  .tray-title {
    margin-top: 20px;
    font-size: 15px;
    font-weight: 700;
    color: #2e7d32;
  }
  .tray {
    margin-top: 10px;
    width: 100%;
    max-width: 560px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    gap: 8px;
  }
  .tool-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #ffffffbb;
    border-radius: 20px;
    padding: 12px 8px 10px;
    width: 32%;
    box-shadow: 0 6px 14px rgba(46,125,50,0.12);
  }
  .tool-slot img {
    width: 100%;
    max-width: 195px;
    height: auto;
    cursor: grab;
    touch-action: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.18));
  }
  .tool-slot img.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.28));
  }
  .tool-slot .label {
    font-size: 15px;
    font-weight: 700;
    color: #3f8b4c;
  }
  .tool-slot img.shake {
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-6px,0) rotate(-6deg); }
    40% { transform: translate(6px,0) rotate(6deg); }
    60% { transform: translate(-4px,0) rotate(-4deg); }
    80% { transform: translate(4px,0) rotate(4deg); }
  }

  .btn-row {
    margin-top: 18px;
    display: flex;
    gap: 12px;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #66bb6a, #2e7d32);
    box-shadow: 0 8px 16px rgba(46,125,50,0.35);
    transition: transform 0.15s;
  }
  button:active { transform: scale(0.95); }
  button.secondary {
    background: linear-gradient(135deg, #ffb84d, #ff8a5b);
    box-shadow: 0 8px 16px rgba(255,138,91,0.35);
  }

  .confetti {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 6;
  }
  .confetti span {
    position: absolute;
    top: -10%;
    font-size: 22px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(420px) rotate(360deg); opacity: 0; }
  }

  .start-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, #eafff0 0%, #e3f9e9 55%, #f0fff6 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 100;
    text-align: center;
    padding: 20px;
  }
  .start-overlay h2 {
    font-size: 26px;
    color: #2e7d32;
    margin: 0;
  }
  .start-overlay p {
    font-size: 16px;
    color: #4c9a58;
    max-width: 320px;
    margin: 0;
  }
  .start-btn {
    font-family: inherit;
    font-size: 20px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    padding: 18px 42px;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #66bb6a, #2e7d32);
    box-shadow: 0 12px 24px rgba(46,125,50,0.4);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
</style>
</head>
<body>
<div class="start-overlay" id="startOverlay">
  <h2>🌸 الزهرة ذابلة!</h2>
  <p>اضغط الزر لبدء النشاط وتشغيل صوت المرشد 🔊</p>
  <button class="start-btn" id="startBtn">▶️ ابدأ النشاط</button>
</div>
<div class="wrap">
  <h1>💧 بماذا أسقي الزهرة؟</h1>
  <p class="sub">اسحب الأداة المناسبة فوق الزهرة الذابلة حتى تتفتح وتصبح جميلة ✨</p>

const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const progressFill = document.getElementById('progressFill');
const bubbleMsg = document.getElementById('bubbleMsg');
const bubbleIcon = document.getElementById('bubbleIcon');
const resetBtn = document.getElementById('resetBtn');
const voiceBtn = document.getElementById('voiceBtn');
const confettiLayer = document.getElementById('confetti');
const roundIndicator = document.getElementById('roundIndicator');

const MAX_ROUNDS = 5;
let currentRound = 1;

const RESPONSES = [
  { icon: "🌟", text: "ممتاز! الزهرة تفتحت وأصبحت جميلة" },
  { icon: "👏", text: "ممتاز! عمل رائع يا بطل" },
  { icon: "🎉", text: "ممتاز! استمر هكذا" },
  { icon: "💫", text: "ممتاز! لقد نجحت في المهمة" },
  { icon: "🏆", text: "ممتاز! أنت بطل العناية بالزهور" }
];
let responseIndex = 0;

const WRONG_MESSAGES = [
  "حاول مرة"
];
let wrongIndex = 0;

const wiltedImg = new Image();
wiltedImg.src = WILTED_SRC;

let DPR = Math.max(window.devicePixelRatio || 1, 1);
let cw = 0, ch = 0;
const GRID = 26;
let originalGrid = [];
let erasedGrid = [];
let totalOpaque = 0;
let erasedCount = 0;
let completed = false;

function sizeCanvas() {
  const rect = stage.getBoundingClientRect();
  cw = rect.width;
  ch = rect.height;
  canvas.width = cw * DPR;
  canvas.height = ch * DPR;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function drawWilted() {
  ctx.clearRect(0, 0, cw, ch);
  // Fully cover the stage so the blooming flower stays completely hidden
  // until the child actually waters (erases) the wilted flower.
  ctx.fillStyle = '#fffdf7';
  ctx.fillRect(0, 0, cw, ch);
  const boxW = cw * 0.78;
  const boxH = ch * 0.78;
  const offX = (cw - boxW) / 2;
  const offY = (ch - boxH) / 2;
  const scale = Math.min(boxW / wiltedImg.width, boxH / wiltedImg.height);
  const drawW = wiltedImg.width * scale;
  const drawH = wiltedImg.height * scale;
  const dx = offX + (boxW - drawW) / 2;
  const dy = offY + (boxH - drawH) / 2;
  ctx.drawImage(wiltedImg, dx, dy, drawW, drawH);
}

function buildGrid() {
  const imgData = ctx.getImageData(0, 0, Math.round(cw*DPR), Math.round(ch*DPR));
  originalGrid = [];
  erasedGrid = [];
  totalOpaque = 0;
  const stepX = cw / GRID;
  const stepY = ch / GRID;
  for (let gy = 0; gy < GRID; gy++) {
    for (let gx = 0; gx < GRID; gx++) {
      const px = Math.min(Math.round((gx + 0.5) * stepX * DPR), imgData.width - 1);
      const py = Math.min(Math.round((gy + 0.5) * stepY * DPR), imgData.height - 1);
      const idx = (py * imgData.width + px) * 4 + 3;
      const isOpaque = imgData.data[idx] > 40;
      originalGrid.push(isOpaque);
      erasedGrid.push(false);
      if (isOpaque) totalOpaque++;
    }
  }
  erasedCount = 0;
}

function startRound() {
  completed = false;
  sizeCanvas();
  drawWilted();
  buildGrid();
  progressFill.style.width = '0%';
  bubbleIcon.textContent = '🙂';
  bubbleMsg.textContent = 'اختر الأداة المناسبة وابدأ السقاية!';
  confettiLayer.innerHTML = '';
  stage.classList.remove('hover-ok','hover-bad');
  roundIndicator.textContent = `الجولة ${currentRound} من ${MAX_ROUNDS}`;
}

function initGame() {
  currentRound = 1;
  startRound();
}

wiltedImg.onload = () => { initGame(); };
window.addEventListener('resize', () => { if (!completed) startRound(); });

function pointInStage(clientX, clientY) {
  const rect = stage.getBoundingClientRect();
  return clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
}

function eraseAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  if (x < 0 || y < 0 || x > cw || y > ch) return;

  const radius = Math.max(cw, ch) * 0.09;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const stepX = cw / GRID;
  const stepY = ch / GRID;
  const rGrid = radius + Math.max(stepX, stepY) * 0.5;
  for (let gy = 0; gy < GRID; gy++) {
    for (let gx = 0; gx < GRID; gx++) {
      const idx = gy * GRID + gx;
      if (!originalGrid[idx] || erasedGrid[idx]) continue;
      const cx = (gx + 0.5) * stepX;
      const cy = (gy + 0.5) * stepY;
      const dx2 = cx - x, dy2 = cy - y;
      if (dx2*dx2 + dy2*dy2 <= rGrid*rGrid) {
        erasedGrid[idx] = true;
        erasedCount++;
      }
    }
  }

  const progress = totalOpaque ? Math.min(erasedCount / totalOpaque, 1) : 0;
  progressFill.style.width = (progress * 100) + '%';

  if (!completed && progress >= 0.62) {
    triggerSuccess();
  }
}

function spawnConfetti() {
  const emojis = ['✨','🌟','🎊','💫','⭐'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.animationDuration = (1.2 + Math.random()*1.2) + 's';
    s.style.animationDelay = (Math.random()*0.3) + 's';
    s.style.fontSize = (16 + Math.random()*16) + 'px';
    confettiLayer.appendChild(s);
  }
  setTimeout(() => { confettiLayer.innerHTML = ''; }, 2600);
}

let cachedVoices = [];
function loadVoices() {
  try { cachedVoices = window.speechSynthesis.getVoices(); } catch(e) {}
}
loadVoices();
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
  speechUnlocked = true;
}

if (window.speechSynthesis) {
  setInterval(() => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    }
  }, 4000);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-SA';
    u.rate = 0.95;
    u.pitch = 1.05;
    u.volume = 1;
    if (!cachedVoices.length) loadVoices();
    const arVoice = cachedVoices.find(v => v.lang && v.lang.startsWith('ar'));
    if (arVoice) u.voice = arVoice;
    window.speechSynthesis.speak(u);
    setTimeout(() => {
      if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
        try {
          const u2 = new SpeechSynthesisUtterance(text);
          u2.lang = 'ar-SA';
          u2.rate = 0.95;
          u2.pitch = 1.05;
          if (arVoice) u2.voice = arVoice;
          window.speechSynthesis.speak(u2);
        } catch (e) {}
      }
    }, 350);
  } catch (e) {}
}

function triggerSuccess() {
  completed = true;
  let alpha = 1;
  const fadeStep = () => {
    alpha -= 0.08;
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, cw, ch);
    ctx.restore();
    if (alpha > 0) requestAnimationFrame(fadeStep);
    else ctx.clearRect(0,0,cw,ch);
  };
  requestAnimationFrame(fadeStep);

  progressFill.style.width = '100%';
  const resp = RESPONSES[responseIndex % RESPONSES.length];
  responseIndex++;
  bubbleIcon.textContent = resp.icon;
  bubbleMsg.textContent = resp.text;
  spawnConfetti();
  speak(resp.text);
  stage.classList.remove('hover-ok','hover-bad');

  setTimeout(() => {
    if (currentRound < MAX_ROUNDS) {
      currentRound++;
      startRound();
    } else {
      finalCelebration();
    }
  }, 2600);
}

function finalCelebration() {
  roundIndicator.textContent = `أكملت جميع الجولات! 🎉 (${MAX_ROUNDS}/${MAX_ROUNDS})`;
  bubbleIcon.textContent = '🏆';
  bubbleMsg.textContent = 'أكملت النشاط خمس مرات! أنت بطل العناية بالزهور';
  spawnConfetti();
  setTimeout(spawnConfetti, 500);
  speak('أكملت النشاط خمس مرات! أنت بطل العناية بالزهور');
}

// ---- Tool dragging (ball, chair, can) ----
const tools = [
  { id: 'ball', el: document.getElementById('tool-ball') },
  { id: 'chair', el: document.getElementById('tool-chair') },
  { id: 'can', el: document.getElementById('tool-can') }
];

let dragState = null;
let wrongShownThisDrag = false;

function onToolPointerDown(e, toolId, el) {
  if (completed) return;
  unlockSpeech();
  e.preventDefault();
  el.classList.add('dragging');
  el.style.transition = 'none';
  el.style.zIndex = 50;
  dragState = { id: toolId, el, startX: e.clientX, startY: e.clientY };
  wrongShownThisDrag = false;
  try { el.setPointerCapture(e.pointerId); } catch(err) {}
}

function onToolPointerMove(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  dragState.el.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`;

  const inside = pointInStage(e.clientX, e.clientY);
  if (dragState.id === 'can') {
    if (inside) {
      stage.classList.add('hover-ok');
      stage.classList.remove('hover-bad');
      eraseAt(e.clientX, e.clientY);
      bubbleIcon.textContent = '💧';
      bubbleMsg.textContent = 'أحسنت! هذا هو إبريق الماء، استمر بالسقاية';
    } else {
      stage.classList.remove('hover-ok');
    }
  } else {
    if (inside) {
      stage.classList.add('hover-bad');
      stage.classList.remove('hover-ok');
      if (!wrongShownThisDrag) {
        wrongShownThisDrag = true;
        const msg = WRONG_MESSAGES[wrongIndex % WRONG_MESSAGES.length];
        wrongIndex++;
        bubbleIcon.textContent = '🔁';
        bubbleMsg.textContent = msg;
        speak(msg);
        dragState.el.classList.remove('shake');
        void dragState.el.offsetWidth;
        dragState.el.classList.add('shake');
      }
    } else {
      stage.classList.remove('hover-bad');
    }
  }
}

function onToolPointerUp(e) {
  if (!dragState) return;
  const el = dragState.el;
  el.style.transition = 'transform 0.35s cubic-bezier(.34,1.56,.64,1)';
  el.style.transform = 'translate(0,0) scale(1)';
  el.classList.remove('dragging');
  el.style.zIndex = '';
  stage.classList.remove('hover-ok','hover-bad');
  if (!completed) {
    bubbleIcon.textContent = '🙂';
    bubbleMsg.textContent = 'اختر الأداة المناسبة وابدأ السقاية!';
  }
  dragState = null;
}

tools.forEach(t => {
  t.el.addEventListener('pointerdown', (e) => onToolPointerDown(e, t.id, t.el));
});
window.addEventListener('pointermove', onToolPointerMove);
window.addEventListener('pointerup', onToolPointerUp);
window.addEventListener('pointercancel', onToolPointerUp);

resetBtn.addEventListener('click', () => { unlockSpeech(); initGame(); });
voiceBtn.addEventListener('click', () => { unlockSpeech(); speak(bubbleMsg.textContent); });

const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', () => {
  startOverlay.style.display = 'none';
  unlockSpeech();
  speak('هيا نبدأ! اختر إبريق الماء واسقِ الزهرة الذابلة');
});
</script>
